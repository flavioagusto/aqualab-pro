name: Sincronizar Instagram

on:
  schedule:
    # Cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar publicaciones de Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: node scripts/sync-instagram.js

      - name: Recompilar CSS (Tailwind)
        run: npm run build

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "aqualab-instagram-bot"
          git config user.email "actions@github.com"
          git add index.html dist/output.css
          if git diff --cached --quiet; then
            echo "Sin cambios en las publicaciones."
          else
            git commit -m "chore: sincronizar publicaciones de Instagram [skip ci]"
            git push
          fi
