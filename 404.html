<!DOCTYPE html>
<html lang="es-PE" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | AquaLab Pro</title>
    <meta name="description" content="La página que buscas no existe. Vuelve a la home o revisa nuestros servicios de análisis de agua, suelos y minerales en Piura.">
    <meta name="robots" content="noindex, follow">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#4f46e5">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/dist/output.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Dark Mode Script - Debe ejecutarse ANTES de que se renderice la página -->
    <script>
        (function() {
            const theme = localStorage.getItem('theme') ||
                         (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body class="antialiased">
    <main class="min-h-screen flex items-center justify-center px-4">
        <div class="text-center max-w-lg">
            <div class="flex items-center justify-center w-20 h-20 rounded-2xl bg-primary/10 mx-auto mb-8">
                <i data-lucide="flask-conical" class="w-10 h-10 text-primary"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-foreground mb-4">404</h1>
            <p class="text-lg text-muted-foreground mb-8">
                No encontramos la página que buscas. Puede que el enlace esté roto o que la página se haya movido.
            </p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="/" class="btn-primary text-base px-6 py-3 rounded-xl justify-center">
                    <i data-lucide="home" class="w-4 h-4 mr-2"></i>
                    Ir al inicio
                </a>
                <a href="/servicios/" class="btn-secondary text-base px-6 py-3 rounded-xl justify-center">
                    <i data-lucide="flask-conical" class="w-4 h-4 mr-2"></i>
                    Ver servicios
                </a>
            </div>
        </div>
    </main>

    <script>
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        } else {
            window.addEventListener('load', () => {
                if (typeof lucide !== 'undefined') lucide.createIcons();
            });
        }
    </script>
</body>
</html>
